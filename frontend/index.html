<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script>
      window.addEventListener('error', (e) => {
        document.body.style.background = '#0a0a0a';
        document.body.innerHTML += `<div style="color:#f87171;font-size:16px;padding:40px;position:absolute;z-index:99999;font-family:monospace;max-width:100%;word-wrap:break-word;">
          <h2 style="color:white;margin-bottom:10px;">REACT FATAL CRASH:</h2>
          ${e.error ? e.error.stack.replace(/\n/g, '<br/>') : e.message}
        </div>`;
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
